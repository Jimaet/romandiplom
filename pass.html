<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Проверка пароля</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #2E2E2E;
      color: white;
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 20px;
    }

    .password-box {
      display: flex;
      align-items: center;
      background: #4E7C4A;
      border-radius: 30px;
      padding: 10px 20px;
      box-shadow: 7px 12px 15px rgba(0, 0, 0, 0.3);
      width: 60%;
      max-width: 500px;
    }

    .password-box input {
      flex: 1;
      border: none;
      background: none;
      color: white;
      font-size: 18px;
      outline: none;
    }

    #strength {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      padding: 10px 20px;
      border-radius: 20px;
      background: #3E5A3A;
      box-shadow: 7px 12px 15px rgba(0, 0, 0, 0.3);
      width: 60%;
      max-width: 500px;
    }

    .weak {
      background: #8B3A3A;
    }

    .medium {
      background: #C2832D;
    }

    .strong {
      background: #3A8B45;
    }
    .back-button-container {
    margin-top: 30px;
}

.back-button {
    background-color: #4E7C4A;
    color: white;
    padding: 10px 20px;
    border-radius: 25px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 7px 12px 15px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s, box-shadow 0.2s;
}

.back-button:hover {
    transform: translateY(-5px);
    box-shadow: 10px 15px 20px rgba(0, 0, 0, 0.4);
}

.back-button:active {
    transform: scale(0.95);
}
  </style>
</head>
<body>
  <h1>Проверка надежности пароля</h1>
  <input type="password" id="password" placeholder="Введите пароль" />
  <div id="strength">Надежность: —</div>

  <script>
    const passwordInput = document.getElementById("password");
    const strengthText = document.getElementById("strength");

    passwordInput.addEventListener("input", function () {
      const password = passwordInput.value;
      let strength = 0;

      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password) && /[a-z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[!@#$%^&*()_+=[\]{};':"\\|,.<>/?`~\-]/.test(password)) strength++;

      if (password.length === 0) {
        strengthText.textContent = "Надежность: —";
        strengthText.className = "";
      } else if (strength <= 1) {
        strengthText.textContent = "Надежность: Слабый пароль";
        strengthText.className = "weak";
      } else if (strength === 2 || strength === 3) {
        strengthText.textContent = "Надежность: Средний пароль";
        strengthText.className = "medium";
      } else if (strength === 4) {
        strengthText.textContent = "Надежность: Сильный пароль";
        strengthText.className = "strong";
      }
    });
  </script>
</body>
</html>
